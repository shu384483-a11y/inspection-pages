<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>文明服务现场检查</title><link rel="stylesheet" href="style.css?v=16"></head><body>
<div class="header"><h1>文明服务现场检查 <span class="ver-tag">四季度版</span></h1><div class="sub">检查 · 整改 · 复核 · 回头看</div></div>
<div id="message" class="notice" role="status">请登录后查看本网点资料。</div>
<form id="login" class="new-form"><h3>账号登录</h3><label>账号<input name="account" type="text" autocomplete="username" placeholder="网点三位简码或管理员邮箱" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary">登录</button><p class="muted">网点输入三位账号，管理员输入邮箱。账号由管理员分配；二维码仅定位网点，权限以登录账号为准。</p></form>
<div id="workspace" hidden><div class="sync-bar no-print"><span id="identity" class="sync-state"></span><button id="refresh">刷新</button><button id="logout">退出</button></div><div class="branch-sel-wrap no-print"><select id="period" aria-label="季度"></select><select id="branch" aria-label="网点"></select></div><div id="infoRow" class="info-row"></div><main id="content"></main><nav class="bottom-nav" id="nav"><button data-tab="check"><span class="bicon">✅</span>复查</button><button data-tab="new"><span class="bicon">📝</span>新增</button><button data-tab="summary"><span class="bicon">📊</span>汇总</button><button data-tab="qr"><span class="bicon">📱</span>二维码</button><button data-tab="rectify"><span class="bicon">🔧</span>整改</button></nav></div>
<script src="config.js?v=18"></script><script src="vendor/qrcode.js?v=16"></script><script src="vendor/xlsx.js?v=16"></script><script src="core.js?v=18"></script><script src="import.js?v=19"></script><script src="app.js?v=19"></script></body></html>
