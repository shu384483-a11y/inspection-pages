<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>文明服务现场检查</title><link rel="stylesheet" href="style.css?v=access2"></head><body>
<div class="header"><h1>文明服务现场检查</h1><div class="sub">检查 · 整改 · 复核 · 回头看</div></div>
<div id="message" class="notice" role="status">请选择检查入口，或扫描本网点整改二维码。</div>
<form id="login" class="new-form"><h3>在线检查与整改</h3><label>使用入口<select id="accessKind"><option value="staff">检查人员</option><option value="branch">网点整改</option></select></label><label id="nameLabel">检查员账号<input id="operatorName" type="text" value="jcy" maxlength="40" autocomplete="username" required></label><label><span id="codeLabel">密码</span><input id="accessCode" type="password" autocomplete="current-password" maxlength="128" required></label><button class="btn btn-primary">进入平台</button><p class="muted" id="entryHelp"></p></form>
<div id="workspace" hidden><div class="sync-bar no-print"><span id="identity" class="sync-state"></span><button id="refresh">刷新</button><button id="logout">退出</button></div><div class="branch-sel-wrap no-print"><select id="period" aria-label="季度"></select><select id="branch" aria-label="网点"></select></div><div id="infoRow" class="info-row"></div><main id="content"></main><nav class="bottom-nav" id="nav"><button data-tab="check"><span class="bicon">✅</span>复查</button><button data-tab="new"><span class="bicon">📝</span>新增</button><button data-tab="summary"><span class="bicon">📊</span>汇总</button><button data-tab="qr"><span class="bicon">📱</span>二维码</button><button data-tab="rectify"><span class="bicon">🔧</span>整改</button></nav></div>
<script src="config.js?v=access2"></script><script src="../vendor/qrcode.js?v=access2"></script><script src="../vendor/xlsx.js?v=access2"></script><script src="core.js?v=access2"></script><script src="import.js?v=access2"></script><script src="access.js?v=access2"></script><script src="app.js?v=access2"></script></body></html>
